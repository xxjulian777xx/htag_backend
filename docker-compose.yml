services:

  postgres:
    image: postgres:16
    container_name: rbac_blog_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: rbac_blog
      POSTGRES_USER: rbac_blog_user
      POSTGRES_PASSWORD: rbac_blog_password
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U rbac_blog_user -d rbac_blog"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  minio:
    image: quay.io/minio/minio:latest
    container_name: rbac_blog_minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    command:
      [
        "server",
        "/data",
        "--console-address",
        ":9001"
      ]

    healthcheck:
      test:
        [
          "CMD",
          "mc",
          "ready",
          "local"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rbac_blog_backend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8200:8000"

    depends_on:
      postgres:
        condition: service_healthy

      minio:
        condition: service_healthy

    volumes:
      - .:/app

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]


  publication_worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rbac_blog_publication_worker
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PUBLICATION_WORKER_INTERVAL: "30"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - .:/app

    command:
      [
        "python",
        "-m",
        "app.workers.publication_worker"
      ]


volumes:
  postgres_data:
  minio_data: